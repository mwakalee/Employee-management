<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management | Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-body">
  <main class="auth-card">
    <h1>Employee Management</h1>
    <p class="muted">Sign in to access your role-based workspace.</p>

    <form id="loginForm" class="form-grid">
      <label>
        Username
        <input id="username" required placeholder="admin" />
      </label>
      <label>
        Password
        <input id="password" type="password" required placeholder="••••••••" />
      </label>
      <button type="submit">Login</button>
    </form>

    <div class="demo-credentials">
      <h3>Demo users</h3>
      <ul>
        <li>Admin: <code>admin / admin123</code></li>
        <li>Manager: <code>sarah.manager / manager123</code></li>
        <li>Employee: <code>alex.employee / employee123</code></li>
        <li>Custom: <code>it.specialist / custom123</code></li>
      </ul>
    </div>

    <p id="loginError" class="error"></p>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
