<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management | Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>PulseHR</h2>
      <p class="muted" id="welcomeText"></p>
      <nav>
        <a class="active">People</a>
      </nav>
      <button id="logoutBtn" class="secondary">Logout</button>
    </aside>

    <main class="main">
      <header class="page-header">
        <div>
          <h1>Employee Directory</h1>
          <p class="muted" id="accessSummary"></p>
        </div>
      </header>

      <section class="cards" id="statsCards"></section>

      <section class="panel" id="editorPanel">
        <h3>Add / Edit Employee</h3>
        <form id="employeeForm" class="form-grid inline-grid">
          <input id="employeeId" type="hidden" />
          <label>Name <input id="name" required /></label>
          <label>Email <input id="email" type="email" required /></label>
          <label>Department <input id="department" required /></label>
          <label>Title <input id="title" required /></label>
          <label>Username <input id="employeeUsername" required /></label>
          <label>Manager Username <input id="managerUsername" /></label>
          <div class="actions">
            <button type="submit">Save Employee</button>
            <button type="button" id="cancelEdit" class="secondary">Cancel</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h3>Employees</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Title</th>
                <th>Department</th>
                <th>Email</th>
                <th>Manager</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="employeeRows"></tbody>
          </table>
        </div>
      </section>

      <p id="statusMessage"></p>
    </main>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
